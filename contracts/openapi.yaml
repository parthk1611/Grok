# Proposals that are not schema changes (need Team Lead approval; not enforced by the MockProvider).
x-proposals:
  weather-latest-selection:
    status: PROPOSAL (RELAY, 2026-11-09)
    rule: |
      1. Location. `cell_id` is used as given. `lat`/`lon` is snapped to the containing ofr10km cell
         (EPSG:3978, grid_spec.md); the response keeps the requested lat/lon and adds that `cell_id`.
      2. Candidates. Only records cached for that cell whose source time passed the plausibility check
         (not > 2 h in the future, not before 2000). Nothing is interpolated across sources or invented.
      3. Pick the record whose `valid_time` is the latest at or before the serving time ("now"):
         a. an observation (swob station mapped to the cell, or CWFIS firewx station) with
            `valid_time` within the source's fresh data-age limit wins first, since it is measured, not modelled;
         b. otherwise the HRDPS forecast hour with `valid_time` = the latest top of hour <= now, taken from the
            newest `source_run_time` that has that hour;
         c. otherwise the newest remaining record of any source (it will report stale or expired).
         Ties: newer `source_run_time`, then newer `retrieved_at`, then source order hrdps, swob_realtime,
         cwfis_firewx_stns.
      4. A forecast hour with `valid_time` in the past used as "latest" is flagged at least `stale`
         (cache_fallback.md). `stale_level`, `age_minutes`, `fetch_age_minutes` and `from_cache` report the
         chosen record, not the best one seen.
      5. No candidate at all: 503 `no_cached_data` (never a default value).

